<title>kshitijOS — Kshitij Pathak</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --ink:#05070c;
    --glass:rgba(20,24,34,.6); --glass2:rgba(28,32,44,.72);
    --winbg:rgba(18,22,30,.82); --winhead:rgba(26,30,40,.9);
    --edge:rgba(255,255,255,.1); --edge2:rgba(255,255,255,.16);
    --text:#eef1f6; --ivory:#f4f1ea; --dim:#9aa6b4; --faint:#616d7c;
    --mint:#5fe3c3; --coral:#ff6a4d; --amber:#f5b544; --green:#4cc77f; --blue:#3a95ff;
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
    --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
    --bar:30px; --dock:100px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:var(--sans);color:var(--text);overflow:hidden;background:var(--ink);
       -webkit-font-smoothing:antialiased;user-select:none;}

  /* ── aurora wallpaper ── */
  #desk{position:fixed;inset:0;overflow:hidden;background:linear-gradient(165deg,#141033 0%,#0b1740 34%,#07223e 60%,#04121f 100%);}
  .aur{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;mix-blend-mode:screen;}
  .a1{width:640px;height:640px;left:-140px;top:-160px;background:radial-gradient(circle,#6a3cff 0%,transparent 66%);animation:d1 30s ease-in-out infinite;}
  .a2{width:720px;height:720px;right:-200px;top:-120px;background:radial-gradient(circle,#1f8fff 0%,transparent 66%);animation:d2 34s ease-in-out infinite;}
  .a3{width:680px;height:680px;left:8%;bottom:-260px;background:radial-gradient(circle,#12c9b0 0%,transparent 66%);animation:d3 38s ease-in-out infinite;}
  .a4{width:520px;height:520px;right:6%;bottom:-200px;background:radial-gradient(circle,#ff5e8a 0%,transparent 66%);opacity:.4;animation:d1 28s ease-in-out infinite;}
  @keyframes d1{50%{transform:translate(70px,60px) scale(1.12);}}
  @keyframes d2{50%{transform:translate(-60px,50px) scale(1.1);}}
  @keyframes d3{50%{transform:translate(50px,-50px) scale(1.14);}}
  .vig{position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 40%,transparent 55%,rgba(0,0,0,.4));}

  /* ── desktop icons ── */
  .dicon{position:absolute;z-index:2;width:84px;text-align:center;cursor:pointer;}
  .dicon .g{width:56px;height:56px;margin:0 auto 6px;border-radius:13px;display:flex;align-items:center;
    justify-content:center;font-size:26px;background:linear-gradient(180deg,#232c3a,#151c26);
    border:1px solid var(--edge);box-shadow:0 8px 22px rgba(0,0,0,.4);}
  .dicon .nm{font-size:11.5px;font-family:var(--sans);color:#eaf0f6;text-shadow:0 1px 3px rgba(0,0,0,.7);}
  .dicon:hover .g{border-color:var(--mint);}

  /* ── menu bar ── */
  .menubar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:5001;
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--edge);
    font-size:13px;}
  .menubar .l{display:flex;align-items:center;gap:18px;}
  .menubar .logo{font-size:15px;}
  .menubar .app{font-weight:600;color:var(--text);}
  .menubar .mi{color:var(--dim);font-size:12.5px;}
  .menubar .r{display:flex;align-items:center;gap:15px;color:var(--dim);font-size:12.5px;font-family:var(--mono);}
  #mclock{color:var(--text);}

  /* ── windows ── */
  .win{position:fixed;z-index:100;min-width:300px;min-height:200px;
    background:var(--winbg);backdrop-filter:blur(30px) saturate(1.4);
    border:1px solid var(--edge2);border-radius:15px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.3);
    display:flex;flex-direction:column;animation:winIn .26s cubic-bezier(.2,.85,.25,1) both;}
  @keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:none;}}
  .win.closing{animation:winOut .18s ease forwards;}
  @keyframes winOut{to{opacity:0;transform:scale(.96);}}
  .win .head{height:40px;display:flex;align-items:center;gap:8px;padding:0 13px;cursor:grab;flex:0 0 auto;
    background:var(--winhead);border-bottom:1px solid var(--edge);}
  .win .head:active{cursor:grabbing;}
  .lights{display:flex;gap:8px;}
  .lights b{width:12px;height:12px;border-radius:50%;display:block;cursor:pointer;position:relative;border:0;padding:0;}
  .lights .r{background:#ff5f57;} .lights .y{background:#febc2e;} .lights .g{background:#28c840;}
  .lights b::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(0,0,0,.5);opacity:0;}
  .win .head:hover .lights .r::after{content:"✕";opacity:1;}
  .win .head:hover .lights .y::after{content:"–";opacity:1;}
  .win .head:hover .lights .g::after{content:"+";opacity:1;}
  .win .title{font-size:13px;color:var(--dim);margin-left:4px;font-weight:500;}
  .win .title b{color:var(--text);font-weight:600;}
  .win .body{flex:1 1 auto;overflow:auto;position:relative;}
  .win.focused{border-color:rgba(95,227,195,.4);}

  .pad{padding:22px 24px;}
  .pad h2{font-family:var(--serif);font-weight:500;color:var(--ivory);font-size:1.55rem;margin:0 0 6px;}
  .pad .k{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mint);margin:0 0 12px;}
  .pad p{color:var(--dim);line-height:1.62;margin:0 0 12px;}
  .pad p b,.pad strong{color:var(--ivory);}
  .cards{display:grid;gap:11px;}
  @media(min-width:540px){.cards.two{grid-template-columns:1fr 1fr;}}
  .c{background:rgba(255,255,255,.035);border:1px solid var(--edge);border-radius:11px;padding:14px 15px;position:relative;}
  .c h4{margin:0 0 4px;font-size:14.5px;color:var(--text);font-weight:650;}
  .c p{margin:0 0 9px;font-size:13px;color:var(--dim);line-height:1.5;}
  .c a{color:var(--blue);text-decoration:none;font-size:13px;font-family:var(--mono);}
  .badge{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--amber);background:rgba(245,181,68,.14);border-radius:999px;padding:2px 8px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;} .tag{font-family:var(--mono);font-size:10.5px;color:var(--mint);
    background:rgba(95,227,195,.14);border-radius:999px;padding:2px 9px;}
  .timeline{display:flex;flex-direction:column;}
  .tl{display:grid;grid-template-columns:14px 1fr;gap:14px;padding-bottom:18px;}
  .tl .stem{display:flex;flex-direction:column;align-items:center;}
  .tl .dot{width:11px;height:11px;border-radius:50%;background:var(--coral);margin-top:4px;box-shadow:0 0 0 4px rgba(255,106,77,.14);}
  .tl .rail{width:1.5px;flex:1;background:var(--edge2);margin-top:6px;}
  .tl:last-child .rail{display:none;}
  .tl .role{color:var(--text);font-weight:650;font-size:14.5px;}
  .tl .meta{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:2px 0 6px;}
  .tl p{margin:0;font-size:13px;color:var(--dim);line-height:1.5;}
  .links{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px;}
  .links a{font-family:var(--mono);font-size:13px;text-decoration:none;color:var(--text);
    border:1px solid var(--edge);border-radius:10px;padding:9px 13px;transition:.15s;}
  .links a:hover{border-color:var(--coral);color:#fff;background:rgba(255,106,77,.14);}
  .links a.pri{background:var(--coral);color:#fff;border-color:var(--coral);}

  /* Finder */
  .finder{display:flex;height:100%;}
  .fsidebar{width:172px;flex:0 0 auto;background:rgba(255,255,255,.03);border-right:1px solid var(--edge);
    padding:12px 10px;overflow:auto;}
  .fsidebar .grp{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:6px 6px 6px;}
  .fitem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--text);}
  .fitem .fi{font-size:14px;width:18px;text-align:center;}
  .fitem:hover{background:rgba(255,255,255,.05);}
  .fitem.on{background:rgba(58,149,255,.22);}
  .fmain{flex:1 1 auto;overflow:auto;}
  .fbar{position:sticky;top:0;background:var(--winhead);border-bottom:1px solid var(--edge);
    padding:8px 16px;font-family:var(--mono);font-size:12px;color:var(--dim);}
  .fbar b{color:var(--text);}

  /* Notes */
  .noteshell{display:flex;flex-direction:column;height:100%;background:linear-gradient(180deg,#1a1c14,#141610);}
  .noteshell .ntop{padding:8px 16px;border-bottom:1px solid rgba(245,201,80,.18);font-family:var(--mono);
    font-size:11.5px;color:#d8b24a;}
  .noteshell .nbody{padding:20px 22px;overflow:auto;}
  .noteshell h2{font-family:var(--serif);color:#f6f1e2;font-weight:500;font-size:1.5rem;margin:0 0 4px;}
  .noteshell .date{font-family:var(--mono);font-size:11px;color:#8a8467;margin-bottom:14px;}
  .noteshell p{color:#cfcbb8;line-height:1.65;margin:0 0 12px;}
  .noteshell p b{color:#f6f1e2;}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
  .chiprow span{font-family:var(--mono);font-size:11px;color:#d8b24a;border:1px solid rgba(245,201,80,.3);border-radius:999px;padding:3px 10px;}

  /* Safari */
  .safari{display:flex;flex-direction:column;height:100%;}
  .schrome{background:var(--winhead);border-bottom:1px solid var(--edge);padding:8px 12px;display:flex;flex-direction:column;gap:8px;}
  .stabs{display:flex;gap:6px;}
  .stab{font-size:12px;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--edge);
    border-radius:8px 8px 0 0;padding:5px 12px;cursor:pointer;}
  .stab.on{color:var(--text);background:rgba(255,255,255,.09);}
  .saddr{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid var(--edge);
    border-radius:9px;padding:6px 12px;font-family:var(--mono);font-size:12px;color:var(--dim);}
  .saddr .lock{color:var(--green);font-size:11px;}
  .spage{padding:26px 24px;overflow:auto;flex:1;}
  .spage .hero{text-align:center;padding:14px 0 22px;}
  .spage .hero .n{font-family:var(--serif);font-size:2rem;color:var(--ivory);margin:0 0 6px;}
  .spage .hero .r{font-family:var(--mono);font-size:13px;color:var(--mint);}
  .spage .hero p{color:var(--dim);max-width:48ch;margin:14px auto 0;line-height:1.6;}

  /* Photos */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:16px;}
  .ph{aspect-ratio:1/1;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;border:1px solid var(--edge);
    display:flex;align-items:flex-end;transition:transform .15s;}
  .ph:hover{transform:scale(1.03);}
  .ph .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.9;}
  .ph .cap{position:relative;width:100%;padding:8px 10px;font-size:12px;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.6));text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .ph .smp{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.8);
    background:rgba(0,0,0,.35);border-radius:6px;padding:2px 6px;}
  .plight{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
  .plight.on{display:flex;}
  .plight .big{width:min(320px,70%);aspect-ratio:4/3;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:64px;}
  .plight .cap{font-size:15px;color:#fff;} .plight .note{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .plight .close{position:absolute;top:14px;right:16px;color:#fff;cursor:pointer;font-size:18px;background:rgba(255,255,255,.12);
    border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}

  /* Mail */
  .mail{padding:0;display:flex;flex-direction:column;height:100%;}
  .mail .mh{padding:10px 16px;border-bottom:1px solid var(--edge);font-size:13px;color:var(--dim);}
  .mail .mfield{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--edge);font-size:13.5px;}
  .mail .mfield .lb{color:var(--faint);width:60px;font-family:var(--mono);font-size:12px;}
  .mail .mfield .vl{color:var(--text);}
  .mail .mbody{padding:16px;color:var(--dim);font-size:14px;line-height:1.6;flex:1;}
  .mail .mfoot{padding:12px 16px;border-top:1px solid var(--edge);}

  /* iMessage */
  .thread{display:flex;flex-direction:column;gap:8px;padding:16px;}
  .bub{max-width:78%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.4;}
  .bub.them{align-self:flex-start;background:#20303a;color:#e6edf1;border-bottom-left-radius:5px;}
  .bub.me{align-self:flex-end;background:linear-gradient(180deg,#37b24d,#2f9e44);color:#fff;border-bottom-right-radius:5px;}
  .thread .stamp{align-self:center;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:4px 0;}

  /* résumé paper */
  .paper{background:#f6f4ee;color:#1a1a1a;border-radius:8px;padding:22px 24px;font-family:var(--serif);}
  .paper h3{margin:0 0 2px;font-size:1.35rem;color:#111;}
  .paper .role{font-family:var(--mono);font-size:12px;color:#666;margin-bottom:14px;}
  .paper .sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#a33;margin:14px 0 5px;}
  .paper ul{margin:0;padding-left:18px;font-size:12.5px;color:#333;line-height:1.55;font-family:var(--sans);}

  /* terminal */
  .term{background:#080d10;color:#cfe;font-family:var(--mono);font-size:13px;line-height:1.55;padding:14px 16px;height:100%;overflow:auto;}
  .term .ln{white-space:pre-wrap;word-break:break-word;}
  .term .p{color:var(--coral);} .term .u{color:var(--mint);} .term .d{color:var(--dim);} .term .ok{color:var(--green);} .term .warn{color:var(--amber);}
  .term-input{display:flex;gap:8px;align-items:baseline;}
  .term-input input{flex:1;background:transparent;border:0;outline:0;color:#dfe;font-family:var(--mono);font-size:13px;}

  /* ── dock ── */
  .dockbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5000;
    display:flex;gap:13px;align-items:flex-end;padding:9px 13px;
    background:var(--glass2);backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--edge);border-radius:22px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);max-width:94vw;overflow-x:auto;}
  .dapp{position:relative;cursor:pointer;text-align:center;flex:0 0 auto;}
  .dapp .tile{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .16s cubic-bezier(.2,.8,.2,1);}
  .dapp:hover .tile{transform:translateY(-11px) scale(1.16);}
  .dapp .tile svg{width:100%;height:100%;display:block;}
  .dapp .tip{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:11.5px;color:#fff;background:rgba(0,0,0,.72);padding:4px 9px;border-radius:7px;opacity:0;transition:.15s;pointer-events:none;}
  .dapp:hover .tip{opacity:1;}
  .dapp .run{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;}
  .dapp.open .run{opacity:.85;}
  .tile.finder{background:linear-gradient(180deg,#4aa8ff,#1f6fe0);}
  .tile.notes{background:#fff;}
  .tile.safari{background:linear-gradient(180deg,#e9f2fb,#cfe0f2);padding:5px;}
  .tile.photos{background:#fff;}
  .tile.messages{background:linear-gradient(180deg,#63d763,#28b446);}
  .tile.mail{background:linear-gradient(180deg,#42a5ff,#1668d8);}
  .tile.terminal{background:linear-gradient(180deg,#242f3a,#0a1015);}
  .tile.terminal .tg{font-family:var(--mono);font-size:19px;color:#4dd08a;font-weight:700;}
  .flower{width:32px;height:32px;border-radius:50%;position:relative;
    background:conic-gradient(#ff5f57,#febc2e,#28c840,#0a84ff,#5e5ce6,#ff2d55,#ff5f57);}
  .flower::after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%;}

  /* ── boot ── */
  #boot{position:fixed;inset:0;z-index:9999;background:#04060a;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;transition:opacity .6s;}
  #boot .mark{font-family:var(--serif);font-size:2.2rem;color:var(--ivory);}
  #boot .mark b{color:var(--coral);}
  #boot .barwrap{width:220px;height:4px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
  #boot .fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--coral));border-radius:99px;animation:fill 2s ease forwards;}
  @keyframes fill{to{width:100%;}}
  #boot .msg{font-family:var(--mono);font-size:12px;color:var(--faint);height:16px;}

  .hintline{position:fixed;left:50%;bottom:calc(var(--dock) + 16px);transform:translateX(-50%);z-index:400;
    font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.42);pointer-events:none;}
  :focus-visible{outline:2px solid var(--mint);outline-offset:2px;}

  @media (max-width:759px){ .dicon,.hintline{display:none;} .fsidebar{width:132px;} }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s!important;} .aur{animation:none!important;} }
</style>

<div id="desk">
  <div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div><div class="aur a4"></div>
  <div class="vig"></div>
  <div class="dicon" style="top:50px;right:26px" data-open="resume"><div class="g">📄</div><div class="nm">Résumé.pdf</div></div>
  <div class="dicon" style="top:150px;right:26px" data-open="finder"><div class="g">📁</div><div class="nm">Projects</div></div>
  <div class="dicon" style="top:250px;right:26px" data-open="photos"><div class="g">🏆</div><div class="nm">Achievements</div></div>
</div>

<div class="menubar">
  <div class="l">
    <span class="logo">🍎</span>
    <span class="app" id="mActive">Finder</span>
    <span class="mi">File</span><span class="mi">Edit</span><span class="mi">View</span><span class="mi">Window</span>
  </div>

</div>

</div>

<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile=matchMedia('(max-width:759px)').matches||'ontouchstart' in window;
  var BAR=30, DOCK=100, zTop=100, wins={};

  var LINK={ email:'kshitijpathak0212@gmail.com',
    linkedin:'https://www.linkedin.com/in/kshitij-pathak-27460124b/',
    github:'https://github.com/kshitijpathak22' };

  function card(h,p,t,badge,link){
    return '<div class="c">'+(badge?'<span class="badge">'+badge+'</span>':'')+
      '<h4>'+h+'</h4><p>'+p+'</p>'+
      (t&&t.length?'<div class="tags">'+t.map(function(x){return '<span class="tag">'+x+'</span>';}).join('')+'</div>':'')+
      (link?'<div style="margin-top:8px"><a href="'+link+'" target="_blank" rel="noopener">'+link.replace('https://','')+' ↗</a></div>':'')+
      '</div>';
  }
  function tl(role,meta,txt){return '<div class="tl"><div class="stem"><div class="dot"></div><div class="rail"></div></div>'+
    '<div><div class="role">'+role+'</div><div class="meta">'+meta+'</div><p>'+txt+'</p></div></div>';}

  // ── content ──
  var C={
    about:'<div class="k">whoami</div><h2>Kshitij Pathak</h2>'+
      '<p><b>Agentic &amp; GenAI developer at KPMG</b>, currently studying at <b>Manipal University Jaipur</b>. '+

  var DOCK_ORDER=['finder','notes','safari','photos','messages','mail','terminal'];

  // ── window engine ──
  function focusWin(id){
    Object.keys(wins).forEach(function(k){wins[k].el.classList.remove('focused');});
    var w=wins[id]; if(!w)return;
    w.el.style.zIndex=(++zTop); w.el.classList.add('focused');
    document.getElementById('mActive').textContent=APPS[id].title.replace('.pdf','');
    updateDock();
  }
  function openApp(id){
    var app=APPS[id]; if(!app)return;
    if(wins[id]){ if(wins[id].min){wins[id].el.style.display='flex';wins[id].min=false;} focusWin(id); return; }
    var el=document.createElement('div'); el.className='win focused';
    var w=Math.min(app.w,innerWidth-20), h=Math.min(app.h,innerHeight-BAR-DOCK-30);
    if(isMobile){ el.style.left='6px';el.style.right='6px';el.style.top=(BAR+8)+'px';
      el.style.width='auto';el.style.height=(innerHeight-BAR-DOCK-24)+'px'; }
    else{ var n=Object.keys(wins).length;
      el.style.left=Math.max(14,Math.min(innerWidth-w-14, innerWidth/2-w/2+(n*28-46)))+'px';
      el.style.top=Math.max(BAR+14,Math.min(innerHeight-h-DOCK-14, innerHeight*0.14+n*24))+'px';
      el.style.width=w+'px'; el.style.height=h+'px'; }
    el.innerHTML='<div class="head"><div class="lights">'+
      '<button class="r" data-act="close"></button><button class="y" data-act="min"></button><button class="g" data-act="max"></button></div>'+
      '<div class="title"><b>'+app.title+'</b></div></div><div class="body"></div>';
    var body=el.querySelector('.body');
    body.innerHTML=app.body?app.body():'';
    document.getElementById('desk').parentNode.insertBefore(el, document.getElementById('dock'));
    wins[id]={el:el,min:false,prev:null}; el.style.zIndex=(++zTop);
    el.addEventListener('pointerdown',function(){focusWin(id);});
    el.querySelectorAll('.lights b').forEach(function(b){
      b.addEventListener('click',function(e){e.stopPropagation();var a=b.dataset.act;
        if(a==='close')closeWin(id); else if(a==='min'){el.style.display='none';wins[id].min=true;updateDock();} else toggleMax(id);});
    });
    if(!isMobile)dragify(id, el.querySelector('.head'));
    if(app.init==='terminal')initTerm(el);
    if(app.init==='finder')initFinder(el);
    if(app.init==='photos')initPhotos(el);
    if(app.init==='safari')initSafari(el);
    wireResume(el); focusWin(id); updateDock();
  }
  function closeWin(id){var w=wins[id];if(!w)return;w.el.classList.add('closing');
    setTimeout(function(){if(w.el.parentNode)w.el.parentNode.removeChild(w.el);delete wins[id];updateDock();
      var k=Object.keys(wins); if(k.length)focusWin(k[k.length-1]); else document.getElementById('mActive').textContent='Finder';},180);}
  function toggleMax(id){var w=wins[id],el=w.el;
    if(w.prev){Object.assign(el.style,w.prev);w.prev=null;}
    else{w.prev={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
      el.style.left='10px';el.style.top=(BAR+8)+'px';el.style.width=(innerWidth-20)+'px';el.style.height=(innerHeight-BAR-DOCK-20)+'px';}}
  function dragify(id,handle){var sx,sy,ol,ot,drag=false;
    handle.addEventListener('pointerdown',function(e){if(e.target.closest('.lights'))return;drag=true;
      var r=wins[id].el.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ol=r.left;ot=r.top;handle.setPointerCapture(e.pointerId);});
    handle.addEventListener('pointermove',function(e){if(!drag)return;var el=wins[id].el;
      el.style.left=(ol+(e.clientX-sx))+'px';el.style.top=Math.max(BAR,ot+(e.clientY-sy))+'px';el.style.right='auto';});
    handle.addEventListener('pointerup',function(e){drag=false;try{handle.releasePointerCapture(e.pointerId);}catch(_){}}); }

  // ── dock ──

    d.addEventListener('click',function(){openApp(id);});dock.appendChild(d);});

  // ── Terminal ──
  function initTerm(winEl){
    var t=winEl.querySelector('.term');
    var out=document.createElement('div');
    out.innerHTML=['<span class="d">kshitijOS 1.0 — agent shell</span>','<span class="d">the portfolio is an agent. ask it something.</span>',

    var row=document.createElement('div');row.className='term-input';row.innerHTML='<span class="p">kshitij@lab ~ %</span>';
    var input=document.createElement('input');input.setAttribute('autocomplete','off');input.setAttribute('spellcheck','false');
    row.appendChild(input);t.appendChild(row);
    t.addEventListener('click',function(){input.focus();});setTimeout(function(){input.focus();},60);
    function print(h){var d=document.createElement('div');d.className='ln';d.innerHTML=h;out.appendChild(d);t.scrollTop=t.scrollHeight;}
    function echo(c){print('<span class="p">kshitij@lab ~ %</span> '+c);}
    var CMD={
      help:function(){print('<span class="u">commands</span>: whoami · projects · experience · skills · resume · photos · contact · ls · open &lt;app&gt; · clear');},
      whoami:function(){print('Kshitij Pathak — agentic &amp; genai developer @ KPMG, student @ Manipal University Jaipur.');},
      ls:function(){print('<span class="u">finder  notes  safari  photos  messages  mail  terminal</span>  <span class="d">(apps)</span>');},

      resume:function(){print('opening résumé…');openApp('resume');},
      photos:function(){print('opening Photos ▸ achievements…');openApp('photos');},
      contact:function(){print('email: <span class="ok">'+LINK.email+'</span> — opening Messages…');openApp('messages');},
      clear:function(){out.innerHTML='';},
      hire:function(){print('<span class="ok">✓ excellent decision.</span> reach out: '+LINK.email);}
    };
    input.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var raw=input.value.trim();input.value='';
      if(!raw){echo('');return;}echo(raw);var parts=raw.toLowerCase().split(/\s+/),c=parts[0];
      if(c==='open'&&parts[1]){if(APPS[parts[1]]){print('opening '+parts[1]+'…');openApp(parts[1]);}else print('<span class="warn">no such app: '+parts[1]+'</span>');}
      else if(c==='sudo'&&parts.indexOf('hire')>-1)CMD.hire();
      else if(CMD[c])CMD[c]();
      else print('<span class="warn">command not found: '+c+'</span> — try <span class="ok">help</span>');});

  // ── clock + boot ──
  function tick(){var d=new Date();document.getElementById('mclock').textContent=

  var boot=document.getElementById('boot'),bmsg=document.getElementById('bootMsg');
  var steps=['booting…','loading agent core…','mounting apps…','starting Finder…','welcome.'],si=0;

    setTimeout(function(){openApp('finder'); if(!isMobile)setTimeout(function(){openApp('terminal');},280);},reduce?60:540);}
